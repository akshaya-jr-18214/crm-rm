<svg xmlns="http://www.w3.org/2000/svg" width="48" height="48" viewBox="0 0 48 48" fill="none">
  <!-- Planet -->
  <circle cx="24" cy="24" r="10" fill="#6366f1"/>
  <circle cx="24" cy="24" r="10" fill="url(#planetGrad)"/>
  <!-- Orbit ring -->
  <ellipse cx="24" cy="24" rx="22" ry="8" stroke="#818cf8" stroke-width="2" fill="none" transform="rotate(-25 24 24)"/>
  <!-- Small satellite -->
  <circle cx="43" cy="16" r="3" fill="#f59e0b"/>
  <circle cx="43" cy="16" r="1.5" fill="#fbbf24"/>
  <!-- Planet highlight -->
  <circle cx="20" cy="20" r="4" fill="rgba(255,255,255,0.2)"/>
  <defs>
    <radialGradient id="planetGrad" cx="0.35" cy="0.35" r="0.65">
      <stop offset="0%" stop-color="#818cf8"/>
      <stop offset="100%" stop-color="#4f46e5"/>
    </radialGradient>
  </defs>
</svg>
